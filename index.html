:root[data-theme="dark"]{--bg:#0f1a16;--card:#16241e;--ink:#e6efe9;--mut:#9db3a7;--line:#26392f;--code:#1e2f27;--hero:#0a2119;--c1:#6fd0a0;--c2:#5cc7d3;--c3:#e0a27a;--c4:#f08a7c}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 16px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
:focus-visible{outline:3px solid var(--c2);outline-offset:2px}
.hero{background:var(--hero);color:#eaf3ee;position:relative;overflow:hidden;margin-top:calc(-1*env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px)}
.hero div{max-width:1040px;margin:0 auto;padding:44px 20px 120px;position:relative;z-index:1}
.hero svg{position:absolute;left:0;bottom:0;width:100%;height:110px}
h1{font-size:clamp(32px,5.5vw,52px);line-height:1.08;margin:0 0 12px}
.hero p{max-width:62ch;margin:0 0 8px;color:#c9dcd1}
.wrap{max-width:1040px;margin:0 auto;padding:28px 20px 60px;display:grid;grid-template-columns:210px 1fr;gap:36px}
nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start}
nav a{display:block;text-decoration:none;color:inherit;padding:9px 12px;border-left:4px solid var(--m);margin-bottom:8px;border-radius:0 8px 8px 0;font-size:15px;line-height:1.35}
nav a:hover{background:var(--card)}
nav small{display:block;color:var(--mut)}
.prog{font-size:14px;color:var(--mut);margin:14px 0 0}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;width:0;background:var(--c1);transition:width .3s}
.mod{margin-bottom:52px}
.mod h2{font-size:27px;margin:0 0 4px;color:var(--m)}
.mod h3{font-size:19px;margin:26px 0 8px}
.mod>p{margin:0 0 10px;color:var(--mut)}
.links{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0;list-style:none}
.links a{display:inline-block;border:1px solid var(--m);color:var(--m);border-radius:20px;padding:3px 14px;font-size:15px;text-decoration:none}
.links a:hover{background:var(--m);color:var(--card)}
.lab,.quiz{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--m);border-radius:10px;padding:16px 18px}
.lab p{margin:0 0 10px;color:var(--mut);font-size:15px}
button{font:inherit;font-size:15px;background:var(--m);color:var(--card);border:0;border-radius:8px;padding:6px 14px;cursor:pointer;margin:0 6px 6px 0}
input,textarea{font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.doc{min-height:110px;border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--bg)}
.sh{border-collapse:collapse;max-width:100%;display:block;overflow-x:auto}
.sh td{padding:0;border:1px solid var(--line)}
.sh input{width:104px;border:0;border-radius:0;background:var(--card);text-align:left}
.sh th{background:var(--code);font-size:13px;padding:2px 6px;border:1px solid var(--line)}
.sl{aspect-ratio:16/9;max-width:460px;background:var(--code);border:1px solid var(--line);border-radius:8px;padding:5%;overflow:hidden}
.sl b{display:block;margin-bottom:6px}
.chart{display:flex;gap:10px;align-items:flex-end;height:110px;margin:8px 0}
.chart i{flex:1;background:var(--m);border-radius:4px 4px 0 0;min-width:24px;transition:height .3s}
details{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--m);border-radius:10px;margin-bottom:10px}
summary{cursor:pointer;padding:13px 16px;font-weight:700;list-style:none;display:flex;gap:10px}
summary::-webkit-details-marker{display:none}
summary:before{content:"+";color:var(--m);width:14px}
details[open]>summary:before{content:"−"}
.body{padding:0 18px 16px}
.body h4{margin:14px 0 4px;font-size:16px}
.body p{margin:0 0 6px}
pre{background:var(--code);border-radius:8px;padding:12px 14px;overflow-x:auto;margin:6px 0;font:14px/1.5 ui-monospace,Consolas,Menlo,monospace}
ol{margin:4px 0 0;padding-left:22px}
.sol{margin-top:12px;border:1px dashed var(--m);border-radius:8px}
.sol summary{padding:8px 12px}
.sol p{padding:0 12px 10px}
.done{display:flex;gap:8px;align-items:center;margin-top:14px;font-size:15px}
.done input{width:20px;height:20px;accent-color:var(--m)}
.qv{overflow:hidden}
.track{display:flex;transition:transform .3s}
.q{flex:0 0 100%;min-width:0;border:0;padding:0 2px;margin:0}
.q legend{font-weight:700;padding:0;margin-bottom:6px}
.q label{display:block;padding:6px 0}
.qn{margin:0 0 8px;color:var(--mut);font-size:15px}
.ctl{margin-top:12px}
.res p{margin:4px 0}
button:disabled{opacity:.4;cursor:default}
.ev .quiz{background:none;border:0;padding:0 18px 16px}
@media (prefers-reduced-motion:reduce){.track{transition:none}}
.ok{color:var(--c1)}.no{color:var(--c4)}
@media (max-width:860px){.wrap{grid-template-columns:1fr;gap:12px}nav{position:static;display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;flex-wrap:wrap}nav a{flex:0 0 auto;border:1px solid var(--line);border-left:4px solid var(--m);margin:0}}
</style>
</head>

sh:'<p>Cambia cualquier celda. Prueba escribir en F1 <code>=SUMA(B2:C5)</code> o cambiar una nota para ver el estado.</p><div id="grid"></div>',
sl:'<p>Ajusta el texto y el tamaño de letra. La diapositiva te dice si está equilibrada.</p><input id="st" value="Tres ideas para ahorrar" aria-label="Título"> <input id="sz" type="range" min="14" max="40" value="28" aria-label="Tamaño"><br><textarea id="sb" rows="3" cols="40" aria-label="Texto">Compara precios. Planifica compras. Evita gastos hormiga.</textarea><div class="sl" id="sp"></div><p id="sf"></p>',
ch:'<p>Cambia los datos de la hoja y observa el informe: no se actualiza hasta que pulses Actualizar.</p><div>Hoja: <input id="d1" type="number" value="40" style="width:70px"> <input id="d2" type="number" value="65" style="width:70px"> <input id="d3" type="number" value="50" style="width:70px"></div><div class="chart" id="cg"></div><button id="up">Actualizar</button><span id="cs"></span>'};
var wk=0,nav="",out="";
M.forEach(function(m,i){
 nav+='<a href="#m'+i+'" style="--m:var('+m.c+')">'+m.n+'<small>'+m.s+'</small></a>';
 out+='<section class="mod" id="m'+i+'" style="--m:var('+m.c+')"><h2>'+m.n+'</h2><p>'+m.g+'</p><h3>Material y enlaces</h3><ul class="links">'+m.L.map(function(l){return '<li><a href="'+l[1]+'" target="_blank" rel="noopener">'+l[0]+'</a></li>'}).join("")+'</ul><h3>Laboratorio en vivo</h3><div class="lab">'+LAB[m.lab]+'</div><h3>Guía de estudio y ejercicios</h3>';
 m.w.forEach(function(w){wk++;
  out+='<details><summary>Semana '+wk+': '+w.t+'</summary><div class="body"><h4>Objetivo</h4><p>'+w.o+'</p><h4>Ejemplo</h4><pre>'+w.e.replace(/</g,"&lt;")+'</pre><h4>Práctica</h4><ol>'+w.p.map(function(s){return "<li>"+s+"</li>"}).join("")+'</ol><p><b>Producto:</b> '+w.v+'</p><details class="sol"><summary>Ver solución</summary><p>'+w.s+'</p></details><label class="done"><input type="checkbox" data-w="'+wk+'"'+(st[wk]?" checked":"")+'> Marqué esta práctica como hecha</label></div></details>';
 });
 out+='<details class="ev"><summary>Evaluación final del módulo ('+m.q.length+' preguntas)</summary><div class="quiz" data-m="'+i+'"><p class="qn" aria-live="polite"></p><div class="qv"><div class="track">'+m.q.map(function(q,k){return '<fieldset class="q"><legend>'+(k+1)+'. '+q[0]+'</legend>'+q[1].map(function(o,j){return '<label><input type="radio" name="q'+i+'_'+k+'" value="'+j+'"> '+o+'</label>'}).join("")+'</fieldset>'}).join("")+'</div></div><div class="res"></div><div class="ctl"><button class="pv">Anterior</button><button class="nx">Siguiente</button></div></div></details></section>';
});
var nv=document.getElementById("nav");nv.innerHTML=nav+'<div class="prog"><span id="pt"></span><div class="bar"><i id="pb"></i></div></div>';
document.getElementById("main").innerHTML=out;
function prog(){var n=Object.keys(st).filter(function(k){return st[k]}).length;document.getElementById("pt").textContent="Avance: "+n+" de 16 prácticas";document.getElementById("pb").style.width=(n/16*100)+"%"}
document.getElementById("main").addEventListener("change",function(e){if(e.target.dataset.w){st[e.target.dataset.w]=e.target.checked;save();prog()}});
prog();
document.querySelectorAll(".quiz").forEach(function(b){
 var m=M[b.dataset.m],n=m.q.length,i=0,tr=b.querySelector(".track"),qs=b.querySelectorAll(".q"),pv=b.querySelector(".pv"),nx=b.querySelector(".nx"),rs=b.querySelector(".res"),ql=b.querySelector(".qv"),ctl=b.querySelector(".ctl"),qn=b.querySelector(".qn");
 function go(k){i=k;tr.style.transform="translateX(-"+(k*100)+"%)";qs.forEach(function(q,j){if(j===k)q.removeAttribute("inert");else q.setAttribute("inert","")});qn.textContent="Pregunta "+(k+1)+" de "+n;pv.disabled=k===0;nx.textContent=k===n-1?"Ver resultado":"Siguiente"}
 pv.onclick=function(){go(i-1)};
 nx.onclick=function(){if(i<n-1){go(i+1);return}
  var s=0,h="";m.q.forEach(function(q,k){var r=b.querySelector('input[name="q'+b.dataset.m+'_'+k+'"]:checked'),ok=r&&+r.value===q[2];if(ok)s++;h+='<p class="'+(ok?"ok":"no")+'">'+(k+1)+'. '+(ok?"Correcto":"Respuesta correcta: "+q[1][q[2]])+'</p>'});
  rs.innerHTML='<strong>Resultado: '+s+' de '+n+'</strong>'+h+'<button class="rt">Intentar de nuevo</button>';
  ql.hidden=ctl.hidden=qn.hidden=true;rs.hidden=false;
  rs.querySelector(".rt").onclick=function(){b.querySelectorAll("input:checked").forEach(function(x){x.checked=false});rs.hidden=true;ql.hidden=ctl.hidden=qn.hidden=false;go(0)}};
 rs.hidden=true;go(0)});
/* Lab I */
var ed=document.getElementById("ed");
document.getElementById("tb").addEventListener("mousedown",function(e){var t=e.target;if(t.dataset.c){e.preventDefault();document.execCommand(t.dataset.c,false,t.dataset.a||null)}});
document.getElementById("lh").onclick=function(){ed.style.lineHeight=ed.style.lineHeight?"":"1.5"};
function wc(){document.getElementById("wc").textContent=(ed.innerText.trim().split(/\s+/).filter(Boolean).length)+" palabras"}
ed.addEventListener("input",wc);wc();
/* Lab II: mini hoja */
var D={A1:"Estudiante",B1:"Nota 1",C1:"Nota 2",D1:"Promedio",E1:"Estado",F1:"",A2:"Ana",B2:"80",C2:"70",A3:"Luis",B3:"65",C3:"60",A4:"Marta",B4:"90",C4:"95",A5:"Pedro",B5:"55",C5:"75"};
for(var r=2;r<=5;r++){D["D"+r]="=PROMEDIO(B"+r+":C"+r+")";D["E"+r]='=SI(D'+r+'>=70;"Aprobado";"Reprobado")'}
var COLS="ABCDEF",inp={};
function num(v){return v!==""&&!isNaN(v)?+v:v}
function flat(a){var o=[];a.forEach(function(x){Array.isArray(x)?o=o.concat(x):o.push(x)});return o}
var F={SUMA:function(){return flat([].slice.call(arguments)).reduce(function(a,b){return a+(typeof b==="number"?b:0)},0)},
PROMEDIO:function(){var n=flat([].slice.call(arguments)).filter(function(x){return typeof x==="number"});return n.length?n.reduce(function(a,b){return a+b},0)/n.length:"#DIV/0"},
MAX:function(){return Math.max.apply(null,flat([].slice.call(arguments)).filter(function(x){return typeof x==="number"}))},
MIN:function(){return Math.min.apply(null,flat([].slice.call(arguments)).filter(function(x){return typeof x==="number"}))},
CONTAR:function(){return flat([].slice.call(arguments)).filter(function(x){return typeof x==="number"}).length},
SI:function(c,a,b){return c?a:b}};
function R(a,b,d){var o=[];for(var c=COLS.indexOf(a[0]);c<=COLS.indexOf(b[0]);c++)for(var r=+a.slice(1);r<=+b.slice(1);r++)o.push(calc(COLS[c]+r,d));return o}
function calc(ref,d){d=d||0;var raw=D[ref];if(raw===undefined||raw==="")return"";if(raw[0]!=="=")return num(raw);
 if(d>20)return"#CICLO";
 try{var js=raw.slice(1).replace(/([A-F]\d+):([A-F]\d+)|([A-F]\d+)/g,function(m,a,b,c){return a?'R("'+a+'","'+b+'",'+(d+1)+')':'C("'+c+'",'+(d+1)+')'}).replace(/\b(SUMA|PROMEDIO|MAX|MIN|CONTAR|SI)\(/g,"F.$1(").replace(/;/g,",").replace(/<>/g,"!=").replace(/([^<>=!])=(?!=)/g,"$1==");
  var t=js.replace(/"[^"]*"/g,'""');if(/[^\w\s.,+\-*\/()<>=!"%]/.test(t)||(t.match(/[A-Za-z_]+/g)||[]).some(function(w){return["C","R","F","SUMA","PROMEDIO","MAX","MIN","CONTAR","SI"].indexOf(w)<0}))return"#ERROR";
  var v=new Function("C","R","F","return "+js)(calc,R,F);return typeof v==="number"&&isFinite(v)?Math.round(v*100)/100:(v===undefined?"#ERROR":v)}catch(e){return"#ERROR"}}
function show(){for(var k in inp)if(document.activeElement!==inp[k])inp[k].value=calc(k)}
var g='<table class="sh"><tr><th></th>'+COLS.split("").map(function(c){return"<th>"+c+"</th>"}).join("")+"</tr>";
for(r=1;r<=5;r++){g+="<tr><th>"+r+"</th>"+COLS.split("").map(function(c){return'<td><input data-r="'+c+r+'" aria-label="Celda '+c+r+'"></td>'}).join("")+"</tr>"}
document.getElementById("grid").innerHTML=g+"</table>";
document.querySelectorAll("#grid input").forEach(function(i){var k=i.dataset.r;inp[k]=i;
 i.onfocus=function(){i.value=D[k]||""};i.oninput=function(){D[k]=i.value;show()};i.onblur=show});
show();
/* Lab III */
function sl(){var s=document.getElementById("sz").value,t=document.getElementById("st").value,b=document.getElementById("sb").value,n=(t+" "+b).trim().split(/\s+/).filter(Boolean).length;
 document.getElementById("sp").innerHTML='<b style="font-size:'+(+s*.6+8)+'px">'+t.replace(/</g,"&lt;")+'</b><span style="font-size:'+(s*.5)+'px">'+b.replace(/</g,"&lt;").replace(/\n/g,"<br>")+'</span>';
 document.getElementById("sf").textContent=s<24?"La letra es pequeña: sube a 24 o más.":(n>40?"Hay mucho texto ("+n+" palabras): deja una sola idea.":"Buen equilibrio ("+n+" palabras).")}
["st","sz","sb"].forEach(function(i){document.getElementById(i).addEventListener("input",sl)});sl();
/* Lab IV */
var shown=[40,65,50];
function ch(){var cur=[1,2,3].map(function(i){return +document.getElementById("d"+i).value||0}),mx=Math.max.apply(null,shown.concat(cur,[1]));
 document.getElementById("cg").innerHTML=shown.map(function(v,i){return'<i style="height:'+(v/mx*100)+'%" title="'+["Ene","Feb","Mar"][i]+': '+v+'"></i>'}).join("");
 document.getElementById("cs").textContent=cur.join()===shown.join()?" Al día":" Desactualizado";return cur}
[1,2,3].forEach(function(i){document.getElementById("d"+i).addEventListener("input",ch)});
document.getElementById("up").onclick=function(){shown=ch();ch()};ch();
</script>
